name: Scrape Task

on:
  schedule:
    - cron: "0 9 * * 6"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests beautifulsoup4 lxml
          pip install rapidocr_onnxruntime opencv-python-headless

      - name: Run scraper
        run: python script.py

      - name: Copy data to docs
        run: |
          mkdir -p docs/data
          cp data/*.csv docs/data/
          cp data/_UPDATE_INFO.txt docs/data/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --quiet && git diff --staged --quiet || git commit -m "Scrape update $(date +'%Y-%m-%d %H:%M:%S')"
          git push
