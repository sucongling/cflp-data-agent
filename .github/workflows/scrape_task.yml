name: Scrape Task

on:
  schedule:
    # 每周六上午 9 点（UTC）运行
    - cron: "0 9 * * 6"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install akshare pandas requests beautifulsoup4 lxml
          pip install rapidocr_onnxruntime opencv-python-headless
          
      - name: Run scraper
        run: |
          python script.py

      - name: Commit and push changes
        run: |
         git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git status
          git diff --quiet && git diff --staged --quiet || git commit -m "Scrape update $(date +'%Y-%m-%d %H:%M:%S')"
          git push
